# ─── Search ──────────────────────────────────────────────────────────────────

union SearchResult = Video | Channel | User | Playlist

type SearchResultEdge {
  node: SearchResult!
  cursor: String!
}

type SearchResultConnection {
  edges: [SearchResultEdge!]!
  pageInfo: PageInfo!
  totalCount: Int
}

enum SearchType {
  VIDEO
  CHANNEL
  USER
  PLAYLIST
  ALL
}

# ─── Shared / Utility Types ──────────────────────────────────────────────────

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type UserError {
  field: String
  message: String!
  code: ErrorCode
}

type DeletePayload {
  success: Boolean!
  errors: [UserError!]
}

enum ErrorCode {
  NOT_FOUND
  UNAUTHORIZED
  FORBIDDEN
  VALIDATION_ERROR
  RATE_LIMITED
  INTERNAL_ERROR
}

# ─── Scalars ─────────────────────────────────────────────────────────────────

scalar DateTime
scalar Date
scalar URL
scalar JSON
